    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">

    <title>مختبر إسقاط وضبط المدن التفاعلي</title>

        @font-face {
            font-family: 'XQ55';
            src: url('xq55.ttf?t=1731341002') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #070a12;
            --panel-bg: rgba(17, 21, 30, 0.95);
            --accent-cyan: #38bdf8;
            --border-glass: #1e2634;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: #f8fafc;
            font-family: 'XQ55', system-ui, -apple-system, Arial, sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* شريط علوي أنيق */
        #top-bar {
            width: 100%;
            background: #11151e;
            border-bottom: 1px solid #1e2634;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            z-index: 50;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-cyan);
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* أدوات التحكم وإضافة المدن */
        .controls-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-act {
            border: 1px solid #2b384e;
            background: #1a2232;
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'XQ55', sans-serif;
            transition: all 0.2s ease;
        }

        .btn-act:hover {
            background: #222c40;
            border-color: #38bdf8;
            color: #ffffff;
        }

        .btn-save-primary {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .btn-save-primary:hover {
            background: #38bdf8;
            color: #070a12;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.7);
        }

        .btn-lock.locked {
            background: #166534;
            border-color: #22c55e;
            color: #bbf7d0;
        }

        /* حقل إضافة مدينة جديدة */
        .add-city-group {
            display: flex;
            align-items: center;
            background: #090d16;
            border: 1px solid #2b384e;
            border-radius: 6px;
            overflow: hidden;
        }

        .add-city-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: 'XQ55', sans-serif;
            font-size: 12px;
            padding: 6px 10px;
            width: 100px;
            outline: none;
            text-align: right;
        }

        .add-city-select {
            background: #11151e;
            border: none;
            border-right: 1px solid #2b384e;
            color: #38bdf8;
            font-family: 'XQ55', sans-serif;
            font-size: 11px;
            padding: 6px 4px;
            outline: none;
            cursor: pointer;
        }

        .add-city-input::placeholder {
            color: #64748b;
        }

        .btn-add-submit {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'XQ55', sans-serif;
            transition: background 0.15s;
        }

        .btn-add-submit:hover {
            background: #3b82f6;
        }

        /* ==================================================================
           مسرح القمر الصناعي — مطابق حرفياً لمشروعنا الأصلي (image-stage)
           ================================================================== */
        #main-stage-area {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
            overflow: auto;
        }

        .image-stage {
            position: relative;
            display: inline-block;
            line-height: 0;
            border: 1px solid rgba(56, 189, 248, 0.28);
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(56, 189, 248, 0.12);
            background: #070a12;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            max-width: 100%;
        }

        #satellite-image {
            width: 760px;
            height: 616px;
            max-width: 95vw;
            height: auto;
            aspect-ratio: 760 / 616;
            display: block;
            object-fit: fill;
            pointer-events: none;
        }

        /* طبقة الإسناد والمرجع الشفافة الأصلية 15518 */
        #ref-overlay-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 5;
            display: none;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        /* طبقة المدن */
        #markers-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            line-height: normal;
        }

        /* ══════════════════════════════════════════════════════════════════
           تصميم المدن والنقط والتظليل — موحد للجميع بحجم 9px ونفس اللون الأبيض
           ══════════════════════════════════════════════════════════════════ */

        .city-marker {
            position: absolute;
            cursor: grab;
            touch-action: none;
            z-index: 10;
            pointer-events: auto;
            transform-origin: 0 0;
        }

        .city-marker:active, .city-marker.dragging {
            cursor: grabbing;
            z-index: 100;
        }

        /* زر حذف المدينة */
        .city-del-btn {
            display: none;
            position: absolute;
            top: -10px;
            right: -10px;
            width: 14px;
            height: 14px;
            background: #dc2626;
            color: #ffffff;
            border-radius: 50%;
            font-size: 10px;
            font-family: monospace;
            line-height: 14px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 0 4px #000;
            z-index: 20;
        }

        .city-marker:hover .city-del-btn {
            display: block;
        }

        /* النقطة موحدة بحجم 8px وإطار أسود دقيق وظل */
        .city-node-item {
            position: relative;
            width: 8px;
            height: 8px;
        }

        .city-node-item .city-dot {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            border: 1.5px solid #000;
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.8), 0 0 1px rgba(0, 0, 0, 0.9);
        }

        /* مسميات المدن — حجم 8px موحد للجميع بلون أبيض ناصع وتظليل محمي */
        .city-node-item .city-label {
            position: absolute;
            font-size: 8px;
            font-weight: 700;
            line-height: 1.2;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 1px 3px #000, 0 0 6px rgba(0, 0, 0, 0.9),
                        1px 0 0 rgba(0, 0, 0, 0.5), -1px 0 0 rgba(0, 0, 0, 0.5);
            font-family: 'XQ55', system-ui, -apple-system, Arial, sans-serif;
            white-space: nowrap;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        /* المواضع الأربعة للنص */
        /* 1. أسفل النقطة (الافتراضي) */
        .city-label.pos-bottom {
            left: -46px;
            top: 11px;
            width: 100px;
            text-align: center;
        }

        /* 2. أعلى النقطة */
        .city-label.pos-top {
            left: -46px;
            bottom: 11px;
            width: 100px;
            text-align: center;
        }

        /* 3. يمين النقطة (للنصوص العربية على يمين النقطة) */
        .city-label.pos-right {
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            text-align: left;
        }

        /* 4. يسار النقطة */
        .city-label.pos-left {
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            text-align: right;
        }

        /* وضع المعاينة النهائي المقفل */
        .preview-mode .city-marker {
            cursor: default !important;
        }
        .preview-mode .city-del-btn {
            display: none !important;
        }

        /* Modal Dialog for Saved Code */
        #code-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: #0f172a;
            border: 1px solid var(--accent-cyan);
            border-radius: 12px;
            width: 90%;
            max-width: 650px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            text-align: right;
        }

        .modal-box h3 {
            margin: 0 0 8px 0;
            color: #38bdf8;
            font-size: 16px;
        }

        .modal-textarea {
            width: 100%;
            height: 180px;
            background: #020617;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            color: #4ade80;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            margin: 12px 0;
            direction: ltr;
            text-align: left;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header id="top-bar">
        <div class="brand-section">
            <span style="font-size: 18px;">🛰️</span>
            <h1 class="brand-title">مختبر إسقاط وضبط المدن المطور</h1>
        </div>

        <div class="controls-toolbar">
            <!-- إضافة مدينة جديدة مع تحديد موضع النص -->
            <div class="add-city-group">
                <input type="text" id="new-city-name" class="add-city-input" placeholder="اسم المدينة..." onkeydown="if(event.key==='Enter') addNewCity()">
                <select id="new-city-pos" class="add-city-select" title="موضع النص بالنسبة للنقطة">
                    <option value="bottom">⬇️ أسفل</option>
                    <option value="top">⬆️ أعلى</option>
                    <option value="right">➡️ يمين</option>
                    <option value="left">⬅️ يسار</option>
                </select>
                <button class="btn-add-submit" onclick="addNewCity()">➕ إضافة</button>
            </div>

            <!-- زر إظهار/إخفاء طبقة الإسناد الأصلية -->
            <button id="btn-ref-overlay" class="btn-act" onclick="toggleRefOverlay()">
                <span id="ref-icon">🗺️</span>
                <span id="ref-text">إظهار خريطة الإسناد</span>
            </button>

            <!-- زر المعاينة -->
            <button id="btn-mode" class="btn-act btn-lock" onclick="togglePreviewMode()">
                <span id="mode-icon">🔒</span>
                <span id="mode-text">معاينة التثبيت</span>
            </button>

            <!-- زر الحفظ -->
            <button id="btn-save" class="btn-act btn-save-primary" onclick="saveCoordinates()">
                <span>💾</span>
                <span>حفظ واعتماد</span>
            </button>

            <!-- إعادة الضبط -->
            <button class="btn-act" style="color: #f87171;" onclick="resetDefaultPositions()">
                <span>🔄</span>
                <span>إعادة ضبط</span>
            </button>
        </div>
    </header>

    <!-- منطقة العرض المركزية (image-stage مطابق للأصل) -->
    <main id="main-stage-area">
        <div class="image-stage" id="stage">
            <img id="satellite-image" src="sample_sat.jpg?t=1731341002" alt="Meteosat Najd Sector">
            <img id="ref-overlay-img" src="ref_layer_760x616.png?v=1" alt="Original Reference Overlay">
            <div id="markers-layer"></div>
        </div>
    </main>

    <!-- نافذة كود الإحداثيات -->
    <div id="code-modal">
        <div class="modal-box">
            <h3>🎉 تم حفظ وتوليد إحداثيات المدن بنجاح!</h3>
            <p style="font-size:12px; color:#cbd5e1;">تم نسخ الكود تلقائياً لحافظة جهازك، كما تم حفظه في ذاكرة المتصفح. يمكنك إرساله لي لاعتماده فوراً:</p>
            <textarea id="output-code" class="modal-textarea" readonly></textarea>
            <div class="modal-actions">
                <button class="btn-act btn-save-primary" onclick="copyModalCode()">📋 إعادة النسخ</button>
                <button class="btn-act" onclick="closeModal()">إغلاق</button>
            </div>
        </div>
    </div>

        let cities = [];
        let isPreviewMode = false;
        let isRefOverlayVisible = false;
        const stage = document.getElementById('stage');
        const layer = document.getElementById('markers-layer');
        const refOverlay = document.getElementById('ref-overlay-img');

        function toggleRefOverlay() {
            isRefOverlayVisible = !isRefOverlayVisible;
            const btn = document.getElementById('btn-ref-overlay');
            const text = document.getElementById('ref-text');
            if (isRefOverlayVisible) {
                refOverlay.style.display = 'block';
                btn.style.background = '#0284c7';
                btn.style.borderColor = '#38bdf8';
                btn.style.color = '#ffffff';
                text.textContent = 'إخفاء خريطة الإسناد';
            } else {
                refOverlay.style.display = 'none';
                btn.style.background = '#1a2232';
                btn.style.borderColor = '#2b384e';
                btn.style.color = '#e2e8f0';
                text.textContent = 'إظهار خريطة الإسناد';
            }
        }

        function initCities() {
            const saved = localStorage.getItem('najd_cities_verified_al_asl');
            if (saved) {
                try {
                    cities = JSON.parse(saved);
                } catch(e) {
                    cities = JSON.parse(JSON.stringify(DEFAULT_CITIES));
                }
            } else {
                cities = JSON.parse(JSON.stringify(DEFAULT_CITIES));
            }
            renderMarkers();
        }

        function updateMarkerPosition(marker, city) {
            const pctX = (city.x / 760) * 100;
            const pctY = (city.y / 616) * 100;
            marker.style.left = pctX + '%';
            marker.style.top = pctY + '%';
        }

        function renderMarkers() {
            layer.innerHTML = '';
            cities.forEach(city => {
                if (!city.pos) city.pos = 'bottom';
                const marker = document.createElement('div');
                marker.className = 'city-marker';
                marker.id = 'marker-' + city.id;
                updateMarkerPosition(marker, city);

                marker.innerHTML = `
                    <div class="city-node-item" style="transform: translate(-4px, -4px);">
                        <div class="city-dot"></div>
                        <div class="city-label pos-${city.pos}" title="انقر لتغيير موضع النص (أسفل / أعلى / يمين / يسار)" onclick="cycleLabelPosition('${city.id}', event)">${city.name}</div>
                        <span class="city-del-btn" title="حذف المدينة" onclick="deleteCity('${city.id}', event)">✕</span>
                    </div>
                `;

                enableDrag(marker, city);
                layer.appendChild(marker);
            });
        }

        // إمكانية النقر على اسم أي مدينة لتبديل موضع النص فوراً (أسفل -> أعلى -> يمين -> يسار)
        function cycleLabelPosition(id, event) {
            if (event) event.stopPropagation();
            const city = cities.find(c => c.id === id);
            if (!city) return;
            const positions = ['bottom', 'top', 'right', 'left'];
            const curIdx = positions.indexOf(city.pos || 'bottom');
            city.pos = positions[(curIdx + 1) % positions.length];
            renderMarkers();
            localStorage.setItem('najd_cities_verified_al_asl', JSON.stringify(cities));
        }

        function addNewCity() {
            const input = document.getElementById('new-city-name');
            const posSelect = document.getElementById('new-city-pos');
            const name = input.value.trim();
            if (!name) return;

            const pos = posSelect ? posSelect.value : 'bottom';
            const id = 'city_' + Date.now();
            const newCity = {
                id: id,
                name: name,
                x: 380,
                y: 308,
                pos: pos
            };

            cities.push(newCity);
            input.value = '';
            renderMarkers();
            localStorage.setItem('najd_cities_verified_al_asl', JSON.stringify(cities));
        }

        function deleteCity(id, event) {
            if (event) event.stopPropagation();
            const city = cities.find(c => c.id === id);
            const cityName = city ? city.name : '';
            if (confirm(`هل تريد حذف مدينة (${cityName})؟`)) {
                cities = cities.filter(c => c.id !== id);
                renderMarkers();
                localStorage.setItem('najd_cities_verified_al_asl', JSON.stringify(cities));
            }
        }

        function enableDrag(el, cityObj) {
            let startX, startY, origX, origY, isDragging = false;
            let longPressTimer = null;
            let hasMoved = false;

            function onPointerDown(e) {
                if (isPreviewMode) return;
                if (e.target.classList.contains('city-del-btn')) return;

                isDragging = true;
                hasMoved = false;
                el.classList.add('dragging');

                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                startX = clientX;
                startY = clientY;
                origX = cityObj.x;
                origY = cityObj.y;

                // ميزة الضغط المطول (Long Press لمدة ثانية) لحذف المدينة بسهولة على الجوال
                longPressTimer = setTimeout(() => {
                    if (!hasMoved && isDragging) {
                        isDragging = false;
                        el.classList.remove('dragging');
                        deleteCity(cityObj.id, e);
                    }
                }, 900);

                window.addEventListener('pointermove', onPointerMove);
                window.addEventListener('pointerup', onPointerUp);
                window.addEventListener('touchmove', onPointerMove, { passive: false });
                window.addEventListener('touchend', onPointerUp);
                e.preventDefault();
            }

            function onPointerMove(e) {
                if (!isDragging || isPreviewMode) return;
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);

                const stageRect = stage.getBoundingClientRect();
                const scaleX = 760 / stageRect.width;
                const scaleY = 616 / stageRect.height;

                const dx = (clientX - startX) * scaleX;
                const dy = (clientY - startY) * scaleY;

                // إذا تحرك الإصبع أكثر من 3 بكسل نلغي مؤقت الحذف لأنه سحب عادي
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    hasMoved = true;
                    if (longPressTimer) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                }

                let newX = Math.round(origX + dx);
                let newY = Math.round(origY + dy);

                newX = Math.max(10, Math.min(750, newX));
                newY = Math.max(10, Math.min(606, newY));

                cityObj.x = newX;
                cityObj.y = newY;

                updateMarkerPosition(el, cityObj);
                e.preventDefault();
            }

            function onPointerUp() {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
                if (!isDragging) return;
                isDragging = false;
                el.classList.remove('dragging');
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);
                window.removeEventListener('touchmove', onPointerMove);
                window.removeEventListener('touchend', onPointerUp);
                localStorage.setItem('najd_cities_verified_al_asl', JSON.stringify(cities));
            }

            el.addEventListener('pointerdown', onPointerDown);
            el.addEventListener('touchstart', onPointerDown, { passive: false });
        }

        function togglePreviewMode() {
            isPreviewMode = !isPreviewMode;
            const btn = document.getElementById('btn-mode');
            const icon = document.getElementById('mode-icon');
            const text = document.getElementById('mode-text');

            if (isPreviewMode) {
                stage.classList.add('preview-mode');
                btn.classList.add('locked');
                icon.textContent = '🔓';
                text.textContent = 'العودة للتعديل';
            } else {
                stage.classList.remove('preview-mode');
                btn.classList.remove('locked');
                icon.textContent = '🔒';
                text.textContent = 'معاينة التثبيت';
            }
        }

        function resetDefaultPositions() {
            if (confirm('هل أنت متأكد من إعادة ضبط كل المدن إلى التوزيع الافتراضي؟')) {
                localStorage.removeItem('najd_cities_verified_al_asl');
                cities = JSON.parse(JSON.stringify(DEFAULT_CITIES));
                renderMarkers();
            }
        }

        function saveCoordinates() {
            const jsonStr = JSON.stringify(cities, null, 2);
            localStorage.setItem('najd_cities_verified_al_asl', jsonStr);

            const modal = document.getElementById('code-modal');
            const textarea = document.getElementById('output-code');
            textarea.value = jsonStr;
            modal.style.display = 'flex';

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(jsonStr).catch(() => {});
            }
        }

        function copyModalCode() {
            const textarea = document.getElementById('output-code');
            textarea.select();
            document.execCommand('copy');
            alert('تم نسخ كود الإحداثيات للحافظة!');
        }

        function closeModal() {
            document.getElementById('code-modal').style.display = 'none';
        }

        window.onload = initCities;
    </script>
</body>
</html>
